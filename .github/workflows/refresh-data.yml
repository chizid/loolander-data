name: Refresh toilet data

# Runs itself at 03:00 UTC on the 1st of every month. You can also start it by
# hand from the Actions tab - use "Dry run" first, and "Only these regions" set
# to denmark for a two-minute test.
on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Only these regions (comma separated, e.g. denmark). Blank = whole world."
        required: false
        default: ""
      dry_run:
        description: "Just print the plan, download nothing"
        type: boolean
        required: false
        default: false

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      # R2 speaks the S3 protocol, so the ordinary AWS CLI works against it.
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # R2 rejects the extra checksum headers newer AWS CLI versions send by
      # default. Without these two lines every upload fails with a 501.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      # The bucket's "S3 API" address, copied verbatim from its Settings page
      # in the Cloudflare dashboard - including the bucket name on the end.
      # It is copied rather than assembled from the account ID because a bucket
      # created with an EU jurisdiction has an extra ".eu" in its hostname, and
      # guessing that wrong fails every upload with a confusing 401.
      R2_S3_API: ${{ secrets.R2_S3_API }}
      DATA_BASE_URL: ${{ vars.DATA_BASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Show disk before we start
        run: df -h /

      - name: Install osmium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends osmium-tool
          osmium --version

      - name: Work out which regions to download
        run: |
          python3 scripts/regions.py \
            ${{ inputs.only && format('--only {0}', inputs.only) || '' }} \
            > plan.tsv
          echo "--- plan ---"
          cut -f1 plan.tsv | paste -sd' ' -

      # Every step below is skipped on a dry run. `exit 0` would only end its
      # own step - the job would carry on and download the world anyway.
      - name: Say what a dry run would have done
        if: ${{ inputs.dry_run }}
        run: echo "Dry run - nothing downloaded. The plan above is what a real run would fetch."

      - name: Extract toilets from every region
        if: ${{ !inputs.dry_run }}
        run: bash scripts/extract.sh < plan.tsv
        env:
          OUT: toilets.geojsonseq

      - name: Build the tiles
        if: ${{ !inputs.dry_run }}
        run: python3 scripts/build_tiles.py toilets.geojsonseq --out out

      - name: Check the result is not broken
        if: ${{ !inputs.dry_run }}
        run: |
          # A test run covers one country, so the worldwide floor does not apply.
          if [ -n "${{ inputs.only }}" ]; then
            python3 scripts/check_sane.py --new out/v1/manifest.json --min-count 100
          else
            python3 scripts/check_sane.py \
              --new out/v1/manifest.json \
              --live "${DATA_BASE_URL%/}/v1/manifest.json"
          fi

      - name: Upload the cells
        if: ${{ !inputs.only && !inputs.dry_run }}
        run: |
          api="${R2_S3_API%/}"          # tolerate a copied trailing slash
          aws s3 sync out/v1/cells "s3://${api##*/}/v1/cells" \
            --endpoint-url "${api%/*}" \
            --content-type application/json \
            --content-encoding gzip \
            --cache-control "public, max-age=86400" \
            --delete --no-progress

      - name: Upload the manifest last
        if: ${{ !inputs.only && !inputs.dry_run }}
        run: |
          # Last, so the manifest never advertises a cell that is not there yet.
          api="${R2_S3_API%/}"
          aws s3 cp out/v1/manifest.json "s3://${api##*/}/v1/manifest.json" \
            --endpoint-url "${api%/*}" \
            --content-type application/json \
            --content-encoding gzip \
            --cache-control "public, max-age=3600" \
            --no-progress

      - name: Summary
        if: always()
        run: |
          python3 scripts/summary.py out/v1/manifest.json || true
          df -h / | tail -1

      - name: Keep the extract log if something went wrong
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-run
          path: |
            plan.tsv
            out/v1/manifest.json
          if-no-files-found: ignore
          retention-days: 14
